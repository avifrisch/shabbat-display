<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- "Add to Home Screen" on an iPad opens it full screen, without Safari's bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Shabbat">
<meta name="theme-color" content="#0D1726">
<title>Shabbat Display</title>
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Frank Ruhl Libre";src:url(fonts/frankruhl-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Frank Ruhl Libre";src:url(fonts/frankruhl-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Frank Ruhl Libre";src:url(fonts/frankruhl-700.woff2) format("woff2");font-weight:700;font-display:swap}

:root{
  --bg:#0D1726;
  --tint:#15253D;
  --panel:rgba(238,231,215,.035);
  --line:rgba(238,231,215,.11);
  --text:#EEE7D7;
  --muted:#9CA8B8;
  --faint:#66748A;
  --gold:#E5BA5E;
  --gold-soft:rgba(229,186,94,.14);
  --sky:#93BFEA;
  --live:#F0705A;
  --warn:#E9A13B;
  --sans:"Archivo",system-ui,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --heb:"Frank Ruhl Libre","David","Times New Roman",serif;
}
*{box-sizing:border-box}
html{font-size:min(calc(100vw / 120), calc(100vh / 67.5));height:100%;background:var(--bg);overflow:hidden}
body{margin:0;height:100%;display:grid;place-items:center;color:var(--text);font-family:var(--sans);
  font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;cursor:none;
  background:radial-gradient(110% 95% at 8% 0%, var(--tint) 0%, var(--bg) 62%);transition:background 60s linear}
.canvas{width:120rem;height:100%;padding:2.3rem 2.6rem 2.1rem;display:grid;grid-template-columns:36.5rem minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) 12.6rem;column-gap:3.2rem;row-gap:1.6rem;position:relative;transition:transform 4s ease}
h3{margin:0;font-weight:600}

/* ---------- side column ---------- */
.side{display:flex;flex-direction:column;gap:1.55rem;min-height:0}
.clock{display:flex;align-items:baseline;gap:.55rem;line-height:.86}
.clock .t{font-size:7.4rem;font-weight:280;font-stretch:86%;letter-spacing:-.025em}
.clock .ap{font-size:1.9rem;color:var(--muted);font-weight:400}
.dates{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.9rem}
.gdate{font-size:1.5rem;font-weight:460}
.hdate{font-family:var(--heb);font-size:1.75rem;color:var(--gold);direction:rtl;white-space:nowrap}
.offline{margin-top:.5rem;font-size:1rem;color:var(--warn)}
.agenda-next{margin-top:.7rem;font-size:1.22rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-next b{color:var(--text);font-weight:560;margin:0 .3rem}
.now{display:grid;grid-template-columns:5.2rem auto 1fr;column-gap:1.15rem;align-items:center}
.now svg{width:5.2rem;height:5.2rem;color:var(--sky)}
.now .temp{font-size:5.9rem;font-weight:300;font-stretch:88%;line-height:.85;letter-spacing:-.02em}
.now .cond{font-size:1.45rem;font-weight:500;margin-bottom:.25rem}
.now .meta{font-size:1.1rem;color:var(--muted);line-height:1.45}
.nws{font-family:var(--serif);font-size:1.22rem;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nws b{font-family:var(--sans);font-weight:600;font-size:1.05rem;color:var(--muted);margin-right:.4rem}
.hourly{display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.85rem 0}
.hourly div{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.hourly .h{font-size:.98rem;color:var(--muted)}
.hourly svg{width:1.9rem;height:1.9rem;color:var(--sky)}
.hourly .v{font-size:1.25rem;font-weight:500}
.hourly .p{font-size:.85rem;color:var(--sky);min-height:1rem}
.days{display:flex;flex-direction:column;gap:.15rem}
.day{display:grid;grid-template-columns:3.9rem 2.2rem 3.1rem 2.6rem 1fr 2.6rem;align-items:center;column-gap:.7rem;height:2.8rem}
.day .n{font-size:1.2rem;font-weight:500}
.day svg{width:1.9rem;height:1.9rem;color:var(--sky)}
.day .p{font-size:.95rem;color:var(--sky)}
.day .lo{font-size:1.2rem;color:var(--muted);text-align:right}
.day .hi{font-size:1.2rem;font-weight:500}
.range{position:relative;height:.42rem;border-radius:1rem;background:rgba(238,231,215,.07)}
.range i{position:absolute;top:0;bottom:0;border-radius:1rem;background:linear-gradient(90deg,#7FAEDD,#E7C27A)}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.alert{display:none;align-items:center;gap:.8rem;margin-bottom:1rem;padding:.65rem 1rem;border-radius:.6rem;
  background:rgba(233,161,59,.13);color:#F3C784;font-size:1.15rem;font-weight:500}
.alert.on{display:flex}
.alert.severe{background:rgba(240,112,90,.16);color:#F7A898}
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;padding-bottom:.95rem;border-bottom:1px solid var(--line);margin-bottom:1.45rem}
.stage-title{font-size:2.15rem;font-weight:620;font-stretch:90%;letter-spacing:-.005em;line-height:1}
.head-right{display:flex;align-items:center;gap:2rem}
.chips{display:flex;gap:.8rem}
.chip{display:none;align-items:center;gap:.6rem;font-size:1.1rem;font-weight:600;padding:.3rem .8rem;border-radius:2rem;background:rgba(240,112,90,.13)}
.chip.on{display:flex}
.chip .dot,.livedot{width:.6rem;height:.6rem;border-radius:50%;background:var(--live);box-shadow:0 0 .6rem var(--live)}
.scenes{display:flex;gap:1.5rem;font-size:1.02rem;color:var(--faint)}
.scenes span{position:relative;padding-bottom:.5rem}
.scenes span.on{color:var(--text)}
.scenes span i{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--text)}
.scene-wrap{position:relative;flex:1;min-height:0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;flex-direction:column;gap:1.6rem;min-height:0}
.scene.show{opacity:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:2.6rem;min-height:0}
.col{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.col-h{display:flex;justify-content:space-between;align-items:baseline;font-size:1.12rem;color:var(--muted);margin-bottom:.55rem}
.col-h h3{font-size:1.12rem;color:var(--muted)}
.age{font-size:.95rem;color:var(--faint);font-weight:400}
.age.stale{color:var(--warn)}
.empty{font-size:1.2rem;color:var(--faint);padding:.8rem 0;border-top:1px solid var(--line)}

/* headlines */
.hl{border-top:1px solid var(--line);padding:.62rem 0 .66rem}
.hl .t{font-family:var(--serif);font-size:1.5rem;line-height:1.24;font-weight:450;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hl .w{font-size:.92rem;color:var(--faint);margin-top:.22rem}
.hl.lead .t{font-size:2.15rem;line-height:1.15;font-weight:500;-webkit-line-clamp:3}
.hl.lead .s{font-family:var(--serif);font-size:1.28rem;line-height:1.4;color:var(--muted);margin-top:.5rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hl.mega .t{font-size:2.9rem;line-height:1.1;-webkit-line-clamp:3}
.hl.mega .s{font-size:1.45rem;-webkit-line-clamp:2}

/* transactions */
.tx{border-top:1px solid var(--line);padding:.58rem 0;font-size:1.22rem;line-height:1.32;display:grid;grid-template-columns:4.4rem 1fr;column-gap:.8rem}
.tx .d{font-size:.95rem;color:var(--faint);padding-top:.2rem}
.tx .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* agenda */
.ev{border-top:1px solid var(--line);padding:.72rem 0 .76rem;display:grid;grid-template-columns:7.6rem minmax(0,1fr);column-gap:1.1rem;align-items:baseline}
.ev .tm{font-size:1.32rem;font-weight:560;white-space:nowrap}
.ev .tm small{display:block;font-size:.95rem;color:var(--faint);font-weight:400;margin-top:.2rem}
.ev .tt{font-family:var(--serif);font-size:1.62rem;line-height:1.22;font-weight:450;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .lc{font-size:1.05rem;color:var(--muted);margin-top:.22rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.allday .tm{font-size:.95rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ev.past .tm,.ev.past .tt,.ev.past .lc,.ev.past .tm small{color:var(--faint)}
.ev.now .tm,.ev.now .tm small,.ev.next .tm{color:var(--sky)}
.ev.deadline .tm,.ev .tag,.agenda-next .dl{color:var(--warn)}
.ev .tag{font-family:var(--sans);font-size:.9rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:.6rem;vertical-align:.12em}

/* games */
.gc{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.35rem 1.6rem 1.25rem;min-width:0}
.gc-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:1.15rem;color:var(--muted);margin-bottom:.8rem}
.gc-head .st{display:flex;align-items:center;gap:.9rem;color:var(--text);font-weight:600}
.gc-row{display:grid;grid-template-columns:4.4rem minmax(0,1fr) auto 2.6rem 2.6rem;align-items:center;column-gap:1rem;padding:.3rem 0}
.gc-row .ab{font-size:1.25rem;font-weight:700;font-stretch:78%;letter-spacing:.03em;color:var(--muted)}
.gc-row .nm{font-size:1.95rem;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-row .nm small{font-size:1rem;color:var(--faint);font-weight:400;margin-left:.6rem}
.gc-row .r{font-size:3.1rem;font-weight:620;font-stretch:84%;text-align:right;min-width:3rem;line-height:1}
.gc-row .he{font-size:1.05rem;color:var(--faint);text-align:right}
.gc-row.lose .nm,.gc-row.lose .r{color:var(--muted)}
.gc-legend{display:grid;grid-template-columns:4.4rem minmax(0,1fr) auto 2.6rem 2.6rem;column-gap:1rem;font-size:.85rem;color:var(--faint);text-align:right}
.gc-foot{margin-top:.8rem;padding-top:.75rem;border-top:1px solid var(--line);font-size:1.12rem;color:var(--muted);display:flex;justify-content:space-between;gap:1rem}
.gc-foot b{color:var(--text);font-weight:600}
.outs{display:flex;gap:.3rem}
.outs i{width:.55rem;height:.55rem;border-radius:50%;border:1.5px solid var(--muted)}
.outs i.on{background:var(--text);border-color:var(--text)}
.diamond{width:2.6rem;height:2rem}
.season{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.season .big{font-size:2.5rem;font-weight:600;font-stretch:88%;line-height:1.05}
.season .sub{font-size:1.25rem;color:var(--muted)}
.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.75rem 1rem}
.mini .st{font-size:.95rem;color:var(--muted);margin-bottom:.35rem;display:flex;align-items:center;gap:.45rem}
.mini .rw{display:flex;justify-content:space-between;font-size:1.45rem;font-weight:600;font-stretch:85%;line-height:1.3}
.mini .rw.lose{color:var(--muted);font-weight:450}

/* standings */
.stand{width:100%;border-collapse:collapse;font-size:1.28rem}
.stand th{font-size:.92rem;font-weight:500;color:var(--faint);text-align:right;padding:0 .5rem .45rem}
.stand th:first-child{text-align:left}
.stand td{padding:.5rem;text-align:right;border-top:1px solid var(--line)}
.stand td:first-child{text-align:left;font-weight:600}
.stand td.nm{text-align:left;font-weight:400;color:var(--muted);font-size:1.1rem}
.stand tr.me td{background:repeating-linear-gradient(90deg,rgba(238,231,215,.045) 0 1px,transparent 1px 1.1rem);color:var(--text)}
.stand tr.me td.nm{color:var(--text)}

/* other sports and business */
.mini.me{border-color:rgba(229,186,94,.45)}
.sp-line{font-size:1.15rem;margin:.7rem 0 0}
.sp-line td:first-child{text-align:left;color:var(--muted);font-weight:600}
.sp-line .rhe{font-weight:700}
.idx-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-bottom:1.2rem}
.idx{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.4rem}
.idx .n{font-size:1.1rem;color:var(--muted)}
.idx .v{font-size:2.6rem;font-weight:620;font-stretch:86%;line-height:1.15}
.idx .c{font-size:1.25rem;font-weight:600}
.up{color:#7FC98A}.down{color:var(--live)}
.biz-note{font-size:1rem;color:var(--faint);margin:-.6rem 0 .8rem}
.wl td.up,.wl td.down{font-weight:600}

/* ---------- interaction ---------- */
/* Panels open over the scene; nothing looks tappable until someone touches the screen. */
/* On screens taller than 16:9 (an iPad, a 16:10 laptop) the canvas takes the full height: the scene area
   grows and the left column spreads out. A 16:9 screen is unchanged (the canvas is exactly 67.5rem). */
@media (max-aspect-ratio:17/10){.side{justify-content:space-between}}
/* On a touch screen (the iPad) panels cover the whole screen, a size larger */
body.fullpanel .panel{position:fixed;inset:0;z-index:20;border:0;border-radius:0}
body.fullpanel .panel-body{padding:2.4rem 7rem 1.6rem}
body.fullpanel .panel-body>*{zoom:1.3}
body.fullpanel .read{margin:0 auto}
body.fullpanel .panel-x{top:1.4rem;right:1.6rem;width:4.2rem;height:4.2rem;font-size:1.7rem}
body.fullpanel .panel-count{padding:.9rem 7rem 1.1rem;font-size:1.15rem}
.scene-wrap,.stage-head{touch-action:pan-y}  /* horizontal drags are ours (swipes), vertical ones scroll */
/* iPadOS before 16 ignores overscroll-behavior; a fixed body keeps a panel's scroll from bouncing the whole page */
body{position:fixed;inset:0}
.scene{pointer-events:none}.scene.show{pointer-events:auto}  /* the faded-out layer must not catch taps */
.stage,.side{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}  /* drags swipe or scroll, not select */
.panel{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:#111D30;border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.panel[hidden]{display:none}
.panel-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2rem 2.4rem 1.2rem;
  scrollbar-width:thin;scrollbar-color:rgba(238,231,215,.2) transparent}
.panel-count{flex:none;padding:.7rem 2.4rem .9rem;border-top:1px solid var(--line);font-size:.98rem;color:var(--faint)}
.panel-x{position:absolute;top:.9rem;right:.9rem;z-index:1;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;
  font-size:1.35rem;color:var(--muted);background:rgba(238,231,215,.08)}
.panel-msg{font-size:1.3rem;color:var(--muted);padding:1rem 0}
.read{max-width:62rem;padding-right:3rem}
.read-src{font-size:.95rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.read-h{font-family:var(--serif);font-size:2.6rem;line-height:1.14;font-weight:500;margin:.5rem 0 1.3rem}
.read p{font-family:var(--serif);font-size:1.55rem;line-height:1.5;margin:0 0 1rem;color:#E4DDCC}
.read p.read-note{font-family:var(--sans);font-size:1.15rem;color:var(--warn);margin-top:1.4rem}
.box-head{display:flex;gap:1.6rem;align-items:center;font-size:1.15rem;color:var(--muted);margin-bottom:1rem;padding-right:4rem}
.box-st{display:flex;align-items:center;gap:.8rem;color:var(--text);font-weight:600}
.box-count{font-weight:500;color:var(--muted)}
.box-line,.box-t{border-collapse:collapse;font-variant-numeric:tabular-nums}
.box-line{font-size:1.35rem;margin-bottom:.9rem}
.box-line th,.box-line td{padding:.25rem .7rem;text-align:center;border-bottom:1px solid var(--line)}
.box-line th{font-size:.95rem;font-weight:500;color:var(--faint)}
.box-line td:first-child{text-align:left;padding-left:0;font-weight:600;min-width:9rem}
.box-line .rhe{font-weight:700;border-left:1px solid var(--line)}
.box-line tr.me td,.box-t th.me,.box-pre .me{color:var(--gold)}
.box-notes{font-size:1.08rem;line-height:1.5;margin-bottom:1.1rem}
.box-notes span{color:var(--faint);font-weight:600;margin-right:.2rem}
.box-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:2.4rem}
.box-t{width:100%;font-size:1.12rem;margin-bottom:.9rem}
.box-t th{font-size:.92rem;font-weight:500;color:var(--faint);text-align:right;padding:0 .35rem .3rem;border-bottom:1px solid var(--line)}
.box-t th:first-child{text-align:left;font-size:1.05rem;font-weight:600;color:var(--text)}
.box-t td{text-align:right;padding:.2rem .35rem;border-bottom:1px solid rgba(238,231,215,.05)}
.box-t td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13rem}
.box-t td.sub{padding-left:1rem}
.box-t small{color:var(--faint);font-size:.85rem}
.box-sub{font-size:1rem;color:var(--faint);margin:.6rem 0}
.box-pre{display:flex;gap:1.5rem;align-items:baseline;font-size:1.4rem;padding:.6rem 0;border-top:1px solid var(--line)}
.box-pre span{min-width:10rem;color:var(--muted)}
.fc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:2.2rem}
.fc-h{font-size:.95rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
.fc-h small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint);margin-left:.5rem}
.fc-left .fc-h:not(:first-child){margin-top:1.2rem}
.fc-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55rem 1rem;font-size:1.2rem}
.fc-facts span{display:block;font-size:.88rem;color:var(--faint)}
.fc-graph{width:100%;height:auto;display:block;overflow:visible}
.fc-graph .temp{fill:none;stroke:var(--gold);stroke-width:2;vector-effect:non-scaling-stroke}
.fc-graph .bar{fill:var(--sky);opacity:.55}
.fc-graph .ax{stroke:var(--line);vector-effect:non-scaling-stroke}
.fc-graph .mark{stroke:var(--gold);stroke-dasharray:3 3;opacity:.6;vector-effect:non-scaling-stroke}
.fc-graph text{font-family:var(--sans);font-size:11px;fill:var(--faint);text-anchor:middle}
.fc-graph .day{fill:var(--muted);font-weight:600}
.fc-graph .tl{fill:var(--text);font-size:13px}
.fc-graph .amt{fill:var(--sky)}
.fc-graph .mlab{fill:var(--gold);text-anchor:start}
.fc-days .day{grid-template-columns:3.9rem 2.2rem 3.1rem 2.6rem 1fr 2.6rem 3.4rem;height:2.6rem}
.fc-days .amt{font-size:.95rem;color:var(--sky);text-align:right}
.fc-words{display:none;font-family:var(--serif);font-size:1.2rem;line-height:1.42;padding:.2rem 0 .7rem 3.9rem;color:#E4DDCC}
.fc-words p{margin:0 0 .4rem}.fc-words b{font-family:var(--sans);font-size:.98rem;color:var(--muted);margin-right:.3rem}
.fc-day.open .fc-words{display:block}
.fc-radar{position:relative;border-radius:.6rem;overflow:hidden;background:#0A1320}
.fc-radar img{display:block;width:100%;height:auto}
.fc-here{position:absolute;width:.9rem;height:.9rem;margin:-.45rem 0 0 -.45rem;border-radius:50%;background:var(--gold);box-shadow:0 0 0 .3rem rgba(229,186,94,.35)}
.fc-radar-off{position:relative;padding-top:91.67%;font-size:1.15rem;color:var(--faint)}  /* 600x550, as the radar image */
.fc-radar-off span{position:absolute;inset:0;display:grid;place-items:center}
.fc-alert{margin:0 3.5rem 1rem 0;padding:.65rem 1rem;border-radius:.6rem;background:rgba(233,161,59,.13);color:#F3C784;font-size:1.15rem;line-height:1.4}
.fc-alert p{margin:.5rem 0 0;font-size:1.05rem;color:#EBD3A6}
/* shul tab: the weekly chart on weekdays, the bulletin's Shabbat times on Shabbat */
.shul-chart{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start}
.shul-chart img{max-width:100%;max-height:100%;object-fit:contain;border-radius:.5rem;filter:invert(.88) hue-rotate(180deg)}
.shul-foot{flex:none;display:flex;align-items:center;gap:1rem;font-size:1.1rem;color:var(--muted)}
.shul-btn{padding:.45rem 1.1rem;border:1px solid var(--line);border-radius:2rem;color:var(--text);white-space:nowrap}
.shul-stale{color:var(--warn);margin-left:auto;text-align:right}
.st-wrap{flex:1;min-height:0;overflow:hidden}
.st-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:2.6rem;min-height:0;align-content:start}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) auto 6.2rem;column-gap:1rem;align-items:baseline;padding:.36rem 0;border-top:1px solid var(--line)}
.st-row .l{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row .h{font-family:var(--heb);font-size:1.1rem;color:var(--gold);direction:rtl;white-space:nowrap}
.st-row .tm{font-size:1.35rem;font-weight:600;text-align:right;white-space:nowrap}
.st-note{font-size:1.02rem;font-style:italic;color:var(--muted);padding:.2rem 0 .3rem}
.st-msg{font-size:1.15rem;color:var(--warn);margin-bottom:.4rem}
.shul-full{display:block;width:100%;height:auto;border-radius:.5rem;filter:invert(.88) hue-rotate(180deg)}
.shul-pdf{display:block;width:100%;height:100%;border:0;border-radius:.5rem;background:#fff}
.shul-open{display:inline-block;margin-top:1rem;padding:1rem 2rem;border-radius:2rem;background:var(--gold-soft);color:var(--gold);font-size:1.4rem;text-decoration:none}
body.touchable [data-tap],body.touchable [data-scene],body.touchable [data-toggle],body.touchable .panel-x{cursor:pointer}
body.touchable [data-tap]:active,body.touchable [data-scene]:active,body.touchable [data-toggle]:active{opacity:.6}

/* ---------- zmanim band ---------- */
.band{grid-column:1 / -1;display:grid;grid-template-columns:36.5rem minmax(0,1fr);column-gap:3.2rem;border-top:1px solid var(--line);padding-top:1.3rem}
.shab{display:flex;flex-direction:column;justify-content:flex-start}
.shab .ttl{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.shab .en{font-size:2.05rem;font-weight:620;font-stretch:90%;line-height:1.1}
.shab .he{font-family:var(--heb);font-size:1.9rem;font-weight:500;color:var(--gold);direction:rtl;white-space:nowrap}
.shab .rows{display:flex;gap:2.4rem;margin-top:.9rem}
.shab .rows div{display:flex;flex-direction:column;gap:.15rem}
.shab .rows span{font-size:.98rem;color:var(--muted)}
.shab .rows b{font-size:1.5rem;font-weight:560}
.shab .note{margin-top:.75rem;font-size:1.05rem;color:var(--muted)}
.shab .count{font-size:1.25rem;color:var(--gold);margin-top:.35rem}
.sky{position:relative;height:10.6rem}
.sky-bar{position:absolute;left:0;right:0;top:4.25rem;height:1.5rem;border-radius:1rem;overflow:hidden}
.sky-bar .tm{position:absolute;left:2.2rem;top:50%;transform:translateY(-50%);font-size:.85rem;font-weight:600;color:rgba(238,231,215,.8)}
.tick{position:absolute;width:1px;background:rgba(238,231,215,.28)}
.tick.up{top:3.55rem;height:.7rem}
.tick.dn{top:5.75rem;height:.7rem}
.zl{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.15}
.zl.up{top:0}
.zl.dn{top:6.65rem}
.zl .n{font-family:var(--heb);font-size:1.18rem;color:var(--muted)}
.zl.en .n{font-family:var(--sans);font-size:1rem}
.zl .v{font-size:1.38rem;font-weight:520}
.zl.dn .v{order:-1}
.zl.dn{display:flex;flex-direction:column}
.zl.past .n,.zl.past .v{color:var(--faint)}
.zl.next .n,.zl.next .v{color:var(--gold)}
.zl.next .v{font-weight:650}
.marker{position:absolute;top:5rem;width:2rem;height:2rem;margin:-1rem 0 0 -1rem;border-radius:50%;transition:left 30s linear}
.marker.sun{background:radial-gradient(circle at 40% 40%,#FFF4CF,#F2C665 55%,#E1A447);box-shadow:0 0 1.2rem rgba(242,198,101,.75),0 0 0 .25rem rgba(13,23,38,.6)}
.marker.moon{background:#E9E2CF;box-shadow:0 0 .9rem rgba(233,226,207,.5),0 0 0 .25rem rgba(13,23,38,.6)}
.marker.moon::after{content:"";position:absolute;width:1.55rem;height:1.55rem;border-radius:50%;background:#1A2740;top:-.2rem;left:.6rem}

/* shabbat / yom tov mode */
body.holy{--tint:#3A2E1F}
body.holy .band{border-top-color:rgba(229,186,94,.45)}
body.holy .shab .en{color:var(--gold)}

.badge{position:absolute;top:.9rem;right:2.6rem;font-size:.9rem;color:var(--faint)}
.dim{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity 90s linear}
@media (prefers-reduced-motion:reduce){.scene,.marker,.canvas,.dim,body{transition:none}}

<script>
"use strict";
// ------------------------------------------------------------------ basics
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const Q = new URLSearchParams(location.search);
let offset = 0;
if (Q.get("at")) { const t = new Date(Q.get("at")); if (!isNaN(t)) offset = t - Date.now(); }
const NOW = () => new Date(Date.now() + offset);
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function pd(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  const d = new Date(s); return isNaN(d) ? null : d;
}
const sameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
function hm(d) { return (d.getHours() % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0"); }
const ap = (d) => d.getHours() < 12 ? "am" : "pm";
const hmap = (d) => hm(d) + " " + ap(d);
const short = (d) => d.toLocaleDateString("en-US", {month:"short", day:"numeric"});
function dayLabel(d) {
  const n = NOW(); const t = new Date(n); t.setDate(n.getDate()+1);
  if (sameDay(d, n)) return "Today"; if (sameDay(d, t)) return "Tomorrow";
  return d.toLocaleDateString("en-US", {weekday:"short"});
}
function rel(iso) {
  const d = pd(iso); if (!d) return "";
  const m = (NOW() - d) / 60000;
  if (m < 1) return "just now"; if (m < 60) return Math.round(m) + " min ago";
  if (m < 60*24) return Math.round(m/60) + " hr ago";
  return short(d);
}
function ordinal(n) { n = Number(n); const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); }

// ------------------------------------------------------------------ data
let S = null, DEMO = false, lastOk = 0;

async function poll() {
  try {
    const r = await fetch("/api/state" + (screenParam() ? "?screen=" + encodeURIComponent(screenParam()) + (Q.get("preview") === "1" ? "&preview=1" : "") : ""), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    S = await r.json(); DEMO = false; lastOk = Date.now();
  } catch (e) {
    if (!S || DEMO) { S = makeDemo(); DEMO = true; }
  }
  renderAll();
}
// this screen's name in the Display Manager: set by the launcher, or in the iPad's bookmark
const screenParam = () => Q.get("screen") || "";
const D = (k) => (S && S.data && S.data[k]) || null;
const CFG = () => (S && S.config) || {};

function ageHTML(key, label) {
  const m = S && S.meta && S.meta[key];
  if (!m || !m.updated) return `<span class="age">${label || ""}</span>`;
  const mins = (Date.now() / 1000 - m.updated) / 60;
  const txt = mins < 1.5 ? "Updated just now" : mins < 90 ? `Updated ${Math.round(mins)} min ago` : `Updated ${Math.round(mins/60)} hr ago`;
  const stale = m.ok === false && mins > 30;
  return `<span class="age${stale ? " stale" : ""}">${stale ? "Last " + txt.toLowerCase() : txt}</span>`;
}

// ------------------------------------------------------------------ weather
const WX = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",
  73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
  95:"Thunderstorms",96:"Thunderstorms, hail",99:"Thunderstorms, hail"};
function wxIcon(code, day = true) {
  let id = "cloud";
  if (code <= 1) id = day ? "sun" : "moon";
  else if (code === 2) id = day ? "pday" : "pnight";
  else if (code === 3) id = "cloud";
  else if (code === 45 || code === 48) id = "fog";
  else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) id = "rain";
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) id = "snow";
  else if (code >= 95) id = "storm";
  return `<svg><use href="#i-${id}"/></svg>`;
}

function renderSide() {
  const w = D("weather");
  if (w) {
    const c = w.current, t = w.today || {};
    $("wxnow").innerHTML = `${wxIcon(c.code, c.is_day)}<div class="temp">${c.temp}°</div>
      <div><div class="cond">${esc(WX[c.code] || "")}</div>
      <div class="meta">High ${t.hi ?? "–"}°, low ${t.lo ?? "–"}°<br>Feels like ${c.feels}°, wind ${esc(c.wind_dir)} ${c.wind_mph} mph</div></div>`;
    $("hourly").innerHTML = (w.hourly || []).slice(0, 8).map((h) => {
      const d = pd(h.time);
      const lab = (d.getHours() % 12 || 12) + (d.getHours() < 12 ? "a" : "p");
      return `<div><span class="h">${lab}</span>${wxIcon(h.code, h.is_day)}<span class="v">${h.temp}°</span><span class="p">${h.precip >= 20 ? h.precip + "%" : ""}</span></div>`;
    }).join("");
    const days = w.daily || [];
    const lo = Math.min(...days.map((d) => d.lo)), hi = Math.max(...days.map((d) => d.hi)), span = Math.max(hi - lo, 1);
    $("days").innerHTML = days.map((d) => {
      const dt = pd(d.date);
      return `<div class="day"><span class="n">${dt.toLocaleDateString("en-US", {weekday:"short"})}</span>${wxIcon(d.code)}
        <span class="p">${d.precip >= 20 ? d.precip + "%" : ""}</span><span class="lo">${d.lo}°</span>
        <span class="range"><i style="left:${(d.lo-lo)/span*100}%;right:${(hi-d.hi)/span*100}%"></i></span><span class="hi">${d.hi}°</span></div>`;
    }).join("");
  }
  const nws = D("nws");
  $("nws").innerHTML = nws && nws[0] ? `<b>${esc(nws[0].name)}</b>${esc(nws[0].text)}` : "";

  const al = (D("alerts") || [])[0];
  const box = $("alert");
  if (al) {
    const ends = pd(al.ends);
    box.className = "alert on" + (/(Severe|Extreme)/.test(al.severity || "") ? " severe" : "");
    box.textContent = al.event + (ends ? ` until ${dayLabel(ends) === "Today" ? "" : dayLabel(ends) + " "}${hmap(ends)}` : "");
  } else box.className = "alert";
}

function renderClock() {
  const n = NOW();
  $("clk").textContent = hm(n); $("clkap").textContent = ap(n);
  $("gdate").textContent = `${DOW[n.getDay()]}, ${MON[n.getMonth()]} ${n.getDate()}`;
  const h = D("hebdate"); $("hdate").textContent = h ? h.hebrew : "";
  const off = $("offline");
  if (!DEMO && lastOk && Date.now() - lastOk > 3 * 60000) {
    off.hidden = false; off.textContent = `Can't reach the data server since ${hmap(new Date(lastOk))}. Showing the last update.`;
  } else off.hidden = true;
}

// ------------------------------------------------------------------ zmanim band
const ZL = {
  hebrew: {alot:"עלות השחר", sunrise:"הנץ החמה", shema:"סוף זמן ק״ש", tefilla:"סוף זמן תפילה", chatzot:"חצות",
           mincha_gedola:"מנחה גדולה", plag:"פלג המנחה", sunset:"שקיעה", tzeit:"צאת הכוכבים"},
  english: {alot:"Alot", sunrise:"Netz", shema:"Shema", tefilla:"Tefillah", chatzot:"Chatzot",
            mincha_gedola:"Mincha", plag:"Plag", sunset:"Shkia", tzeit:"Tzeit"},
};
const UP = ["alot","shema","chatzot","plag","tzeit"], DN = ["sunrise","tefilla","mincha_gedola","sunset"];

function renderSky() {
  const z = D("zmanim"); if (!z) return;
  const T = {}; for (const k in z.times) T[k] = pd(z.times[k]);
  if (!T.alot || !T.tzeit) return;
  const a = T.alot.getTime() - 40*60000, b = T.tzeit.getTime() + 40*60000, span = b - a;
  const pct = (d) => Math.max(0, Math.min(100, (d.getTime() - a) / span * 100));
  const P = (k) => pct(T[k]).toFixed(2) + "%";
  const grad = `linear-gradient(90deg,#0E1A2D 0%,#28294D ${P("alot")},#8C6A8C ${pct(new Date(T.sunrise - 12*60000)).toFixed(2)}%,
    #6F9BC8 ${pct(new Date(+T.sunrise + 70*60000)).toFixed(2)}%,#7AA6D2 ${P("chatzot")},#6F9BC8 ${pct(new Date(T.sunset - 80*60000)).toFixed(2)}%,
    #D8A15C ${pct(new Date(T.sunset - 8*60000)).toFixed(2)}%,#7B4E6E ${pct(new Date(+T.sunset + 14*60000)).toFixed(2)}%,#202A4A ${P("tzeit")},#0E1A2D 100%)`;
  const n = NOW();
  const order = ["alot","sunrise","shema","tefilla","chatzot","mincha_gedola","plag","sunset","tzeit"];
  const nextKey = order.find((k) => T[k] && T[k] > n);
  const labels = ZL[CFG().zmanim_labels === "english" ? "english" : "hebrew"];
  const en = CFG().zmanim_labels === "english";
  let html = `<div class="sky-bar" style="background:${grad}">${z.is_tomorrow ? `<span class="tm">Tomorrow</span>` : ""}</div>`;
  for (const k of order) {
    if (!T[k]) continue;
    const up = UP.includes(k), cls = (T[k] < n ? " past" : "") + (k === nextKey ? " next" : "");
    let val = hm(T[k]);
    if (k === "shema" && T.shema_mga) val = hm(T.shema_mga) + " / " + hm(T.shema);
    html += `<div class="tick ${up ? "up" : "dn"}" style="left:${P(k)}"></div>`;
    if (k === "shema" && T.shema_mga) html += `<div class="tick up" style="left:${P("shema_mga")}"></div>`;
    html += `<div class="zl ${up ? "up" : "dn"}${en ? " en" : ""}${cls}" style="left:${P(k)}"><div class="n">${labels[k]}</div><div class="v">${val}</div></div>`;
  }
  const isDay = T.sunrise && T.sunset && n > T.sunrise && n < T.sunset;
  html += `<div class="marker ${isDay ? "sun" : "moon"}" style="left:${pct(n).toFixed(2)}%"></div>`;
  $("sky").innerHTML = html;

  // background tint follows the sky
  const R = document.documentElement.style;
  const holy = document.body.classList.contains("holy");
  let tint = "#121F33";
  const tz = D("zmanim").today || z.times;
  const tSunrise = pd(tz.sunrise), tSunset = pd(tz.sunset), tAlot = pd(tz.alot), tTzeit = pd(tz.tzeit);
  if (tSunrise && tSunset) {
    if (n > tAlot && n < tSunrise) tint = "#231F3A";
    else if (n >= tSunrise && n < new Date(tSunset - 50*60000)) tint = "#16304D";
    else if (n >= new Date(tSunset - 50*60000) && n < tTzeit) tint = "#2E2131";
  }
  R.setProperty("--tint", holy ? "#33291D" : tint);
}

function holyState() {
  const cal = D("calendar"); if (!cal) return null;
  const n = NOW();
  const items = cal.items.map((it) => ({...it, d: pd(it.date)})).filter((it) => it.d).sort((x, y) => x.d - y.d);
  const marks = items.filter((it) => it.category === "candles" || it.category === "havdalah");
  const lastMark = [...marks].reverse().find((it) => it.d <= n);
  const nextHav = marks.find((it) => it.category === "havdalah" && it.d > n);
  const nextCandles = marks.find((it) => it.category === "candles" && it.d > n);
  const inHoly = !!(lastMark && lastMark.category === "candles" && nextHav);
  const today0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const parsha = items.find((it) => it.category === "parashat" && it.d >= today0);
  const yt = (when) => when && items.find((it) => it.category === "holiday" && it.yomtov && (sameDay(it.d, when) || sameDay(it.d, new Date(+when + 864e5))));
  const upcoming = items.find((it) => (it.category === "holiday" || it.category === "roshchodesh") && it.d >= today0 && it.d - today0 < 8*864e5);
  return {inHoly, lastMark, nextHav, nextCandles, parsha, ytNow: inHoly && yt(lastMark.d), ytNext: yt(nextCandles && nextCandles.d), upcoming};
}

function renderShabbat() {
  const h = holyState(); const box = $("shab");
  if (!h) { box.innerHTML = ""; return; }
  const n = NOW();
  document.body.classList.toggle("holy", h.inHoly);
  const pName = h.parsha ? h.parsha.title.replace(/^Parashat\s+/, "") : "";
  const pHeb = h.parsha && h.parsha.hebrew ? h.parsha.hebrew.replace(/^פרשת\s+/, "") : "";
  const fmtDay = (d) => d.toLocaleDateString("en-US", {weekday:"short"}) + " " + hmap(d);
  if (h.inHoly) {
    const isYT = !!h.ytNow;
    box.innerHTML = `<div class="ttl"><span class="en">${isYT ? esc(h.ytNow.title) : "Shabbat Shalom"}</span>
        <span class="he">${isYT ? esc(h.ytNow.hebrew || "") : "שבת " + esc(pHeb)}</span></div>
      <div class="rows">${!isYT && pName ? `<div><span>Parashah</span><b>${esc(pName)}</b></div>` : ""}
        <div><span>Havdalah</span><b>${fmtDay(h.nextHav.d)}</b></div></div>`;
    return;
  }
  if (!h.nextCandles) { box.innerHTML = ""; return; }
  const isYT = !!h.ytNext;
  const title = isYT ? h.ytNext.title : `Shabbat ${pName}`;

  const up = h.upcoming && !(isYT && h.upcoming.title === h.ytNext.title)
    ? `<div class="note">${esc(h.upcoming.title)}, ${dayLabel(h.upcoming.d).toLowerCase() === "today" ? "today" : h.upcoming.d.toLocaleDateString("en-US", {weekday:"long"})}</div>` : "";
  box.innerHTML = `<div class="ttl"><span class="en">${esc(title)}</span><span class="he">${esc(heb)}</span></div>
    <div class="rows"><div><span>Candle lighting</span><b>${fmtDay(h.nextCandles.d)}</b></div>
    ${nextHavAfter ? `<div><span>Havdalah</span><b>${fmtDay(nextHavAfter.d)}</b></div>` : ""}</div>${count || up}`;
}

// ------------------------------------------------------------------ agenda
// Weekdays only: hidden from candle lighting until havdalah.
function agendaOn() {
  const a = D("agenda"), h = holyState();
  return !!(a && a.configured) && !(h && h.inHoly) && rotationList().some((r) => r.scene === "agenda");
}
function agendaDay(day) {
  const d0 = new Date(day.getFullYear(), day.getMonth(), day.getDate()), d1 = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
  const a = D("agenda");
  return ((a && a.items) || []).map((e) => ({...e, s: pd(e.start), e: pd(e.end)}))
    .filter((e) => e.s && e.e && e.s < d1 && (e.e > d0 || e.s >= d0))
    .sort((x, y) => (y.all_day - x.all_day) || ((y.kind === "deadline") - (x.kind === "deadline")) || (x.s - y.s));
}
// LPM entry types that get a label
const EV_TAG = {deadline: "Deadline", court_date: "Court"};
function nextAgendaDay() {
  // the day after today, skipping Shabbat
  const n = NOW(); const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  if (d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d;
}
function evRow(e, n, isNext) {
  const tag = EV_TAG[e.kind];
  const body = (t) => `<div><div class="tt">${t ? `<span class="tag">${t}</span>` : ""}${esc(e.title)}</div>${e.location ? `<div class="lc">${esc(e.location)}</div>` : ""}</div>`;
  if (e.all_day) return `<div class="ev allday${e.kind === "deadline" ? " deadline" : ""}"><span class="tm">${tag || "All day"}</span>${body(e.kind === "deadline" ? "" : tag)}</div>`;
  const now = n && e.s <= n && n < e.e, past = n && e.e <= n && e.s <= n;
  const sub = now ? `Now, until ${hmap(e.e)}` : +e.e > +e.s && sameDay(e.s, e.e) ? `to ${hmap(e.e)}` : "";
  return `<div class="ev${now ? " now" : past ? " past" : isNext ? " next" : ""}"><span class="tm">${hmap(e.s)}${sub ? `<small>${sub}</small>` : ""}</span>${body(tag)}</div>`;
}
function sceneAgenda() {
  const n = NOW(), nd = nextAgendaDay();
  const all = agendaDay(n);
  // keep the last two finished events so the rest of the day fits
  const past = all.filter((e) => !e.all_day && e.e <= n);
  const today = all.filter((e) => e.all_day || e.e > n || past.slice(-2).includes(e));
  const next = today.find((e) => !e.all_day && e.s > n);
  const list = (evs, isToday) => evs.length ? evs.map((e) => evRow(e, isToday ? n : null, e === next)).join("")
    : `<div class="empty">${isToday ? (past.length ? "Nothing else on the calendar today." : "Nothing on the calendar today.") : "Nothing scheduled."}</div>`;
  const tom = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  const label = (sameDay(nd, tom) ? "Tomorrow" : DOW[nd.getDay()]) + ", " + short(nd);
  return `<div class="grid2" style="flex:1;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">${col("Today", "agenda", list(today, true))}${col(label, null, list(agendaDay(nd), false))}</div>`;
}
function renderAgendaNext() {
  const box = $("agnext");
  const n = NOW();
  const evs = agendaOn() ? agendaDay(n) : [];
  const nx = evs.find((e) => !e.all_day && e.s > n);
  const dl = evs.filter((e) => e.kind === "deadline").length;
  if (!nx && !dl) { box.hidden = true; return; }
  box.hidden = false;
  const dlTxt = dl ? `<span class="dl">${dl} deadline${dl > 1 ? "s" : ""} today</span>` : "";
  box.innerHTML = nx ? `${dlTxt ? dlTxt + " · " : ""}Next ${hmap(nx.s)}<b>${esc(nx.title)}</b>` : dlTxt;
}

// ------------------------------------------------------------------ games
function diamond(b) {
  const sq = (x, y, on) => `<rect x="${x-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="${on ? "#EEE7D7" : "none"}" stroke="#9CA8B8" stroke-width="1.4"/>`;
  return `<svg class="diamond" viewBox="0 0 40 30">${sq(20,8,b[1])}${sq(31,19,b[0])}${sq(9,19,b[2])}</svg>`;
}
function inningText(g) {
  if (g.state !== "Live") return g.detail;
  if (!g.inning) return g.detail;
  return `${g.inning_state || g.half || ""} ${g.inning_ordinal || g.inning}`.trim();
}
function gameStatusHTML(g) {
  if (g.state === "Live") {
    const outs = [0,1,2].map((i) => `<i class="${i < (g.outs || 0) ? "on" : ""}"></i>`).join("");
    const mid = /Middle|End/.test(g.inning_state || "");
    return `<span class="st"><span class="livedot"></span>${esc(inningText(g))}${mid ? "" : `<span class="outs">${outs}</span>${diamond(g.bases || [])}`}</span>`;
  }
  if (g.state === "Final") return `<span class="st">Final${g.inning && g.inning !== 9 ? ` (${g.inning})` : ""}</span>`;
  const d = pd(g.start);
  return `<span class="st">${d ? `${dayLabel(d)} ${hmap(d)}` : esc(g.detail)}</span>`;
}
// attributes that make a game open the box score
const tapGame = (g) => g.id ? ` data-tap="game" data-id="${Number(g.id)}"` : "";
function gameCard(g, opts = {}) {
  const fin = g.state === "Final";
  const row = (s, other) => {
    const lose = fin && s.score != null && other.score != null && s.score < other.score;
    const sub = g.state === "Preview" ? (s.probable ? s.probable : s.record) : (opts.showRecord ? s.record : "");
    return `<div class="gc-row${lose ? " lose" : ""}"><span class="ab">${esc(s.abbr)}</span>
      <span class="nm">${esc(s.name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>
      <span class="r">${g.state === "Preview" ? "" : (s.score ?? "")}</span>
      <span class="he">${g.state === "Preview" ? "" : (s.hits ?? "")}</span><span class="he">${g.state === "Preview" ? "" : (s.errors ?? "")}</span></div>`;
  };
  const post = g.series && g.game_type && !["R", "S", "E"].includes(g.game_type);
  const series = post ? g.series + (g.series_game ? `, Game ${g.series_game}` : "") : "";
  const head = g.state === "Final" ? [short(pd(g.start)), series].filter(Boolean).join(", ")
             : g.state === "Preview" ? (series || "Next game") : series;
  const foot = [];
  if (g.series_status && post && !opts.noSeriesStatus) foot.push(`<b>${esc(g.series_status)}</b>`);
  if (g.venue) foot.push(`<span>${esc(g.venue)}</span>`);
  const hasHE = g.away.hits != null;
  return `<div class="gc"${tapGame(g)}><div class="gc-head"><span>${esc(head)}</span>${gameStatusHTML(g)}</div>
    ${g.state !== "Preview" ? `<div class="gc-legend"><span></span><span></span><span>R</span><span>${hasHE ? "H" : ""}</span><span>${hasHE ? "E" : ""}</span></div>` : ""}
    ${row(g.away, g.home)}${row(g.home, g.away)}
    ${foot.length ? `<div class="gc-foot">${foot.join("")}</div>` : ""}</div>`;
}
function miniGame(g) {
  const fin = g.state === "Final";
  const rw = (s, o) => `<div class="rw${fin && s.score < o.score ? " lose" : ""}"><span>${esc(s.abbr)}</span><span>${g.state === "Preview" ? "" : (s.score ?? "")}</span></div>`;
  const st = g.state === "Live" ? `<span class="livedot"></span>${esc(inningText(g))}` : g.state === "Final" ? "Final" : esc(hmap(pd(g.start)));
  return `<div class="mini"${tapGame(g)}><div class="st">${st}</div>${rw(g.away, g.home)}${rw(g.home, g.away)}</div>`;
}

// ------------------------------------------------------------------ shul tab
const shulSrc = (e) => e.src || "/shul/" + encodeURIComponent(e.file);
const day0 = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
// this Shabbat or Yom Tov, from the day of its candle lighting through havdalah: the one
// under way, or on Friday (Erev Yom Tov) the one starting tonight
function shabbatSpan() {
  const h = holyState();
  if (!h || !h.nextHav) return null;
  if (h.inHoly) return {start: h.lastMark.d, end: h.nextHav.d, yt: h.ytNow};
  if (h.nextCandles && sameDay(h.nextCandles.d, NOW())) return {start: h.nextCandles.d, end: h.nextHav.d, yt: h.ytNext};
  return null;
}
// the bulletin is this Shabbat's or Yom Tov's if its date falls in that span
function bulletinCurrent(b) {
  const sp = shabbatSpan(), d = pd(b.shabbat);
  return !!(sp && d && d >= day0(sp.start) && d <= day0(sp.end));
}
// Shabbat times show from candle lighting, and on Friday as soon as this week's bulletin is in
function shulShabbatOn() {
  const b = (D("shul") || {}).bulletin;
  return isHoly() || !!(b && b.times && bulletinCurrent(b));
}
function sceneShul() {
  const s = D("shul") || {};
  if (isHoly()) return shulShabbat(s);
  // Friday before candle lighting: the times, with the chart and the rest a tap away
  return shulShabbatOn() ? shulShabbat(s) + shulFoot(s, true) : shulWeek(s);
}
function shulFoot(s, withChart) {
  const n = NOW(), ch = s.chart, wk = ch && pd(ch.week_of);
  const stale = ch && !withChart && (!wk || (new Date(n.getFullYear(), n.getMonth(), n.getDate()) - wk) / 864e5 > 6);
  const month = (f) => MON.find((m) => f.toLowerCase().startsWith(m.toLowerCase())) || f.replace(/\.\w+$/, "");
  const cals = (s.calendars || []).slice().sort((a, b) => (month(a.file) === MON[n.getMonth()] ? -1 : 0) - (month(b.file) === MON[n.getMonth()] ? -1 : 0));
  const btn = (kind, src, title, label) => `<span class="shul-btn" data-tap="${kind}" data-src="${esc(src)}" data-title="${esc(title)}">${esc(label)}</span>`;
  return `<div class="shul-foot">${withChart && ch ? btn("shulimg", shulSrc(ch), "Weekly davening schedule", "Weekly chart") : ""}
      ${cals.map((c) => btn("shulimg", shulSrc(c), month(c.file) + " calendar", month(c.file) + " calendar")).join("")}
      ${s.bulletin ? btn("bulletin", shulSrc(s.bulletin), "Shabbat bulletin", "Bulletin") : ""}
      ${stale ? `<span class="shul-stale">${wk ? `Chart for the week of ${esc(short(wk))}. The new one isn't posted yet.` : "This chart's week isn't known."}</span>` : ""}</div>`;
}
function shulWeek(s) {

  if (!ch) return `<div class="empty">The shul's davening chart hasn't been fetched yet.</div>`;
  return `<div class="shul-chart"><img src="${esc(shulSrc(ch))}" alt="Weekly davening schedule" data-tap="shulimg" data-src="${esc(shulSrc(ch))}" data-title="Weekly davening schedule"></div>
    ${shulFoot(s, false)}`;
}
function shulShabbat(s) {
  const b = s.bulletin || {}, t = b.times;
  // wrong times on Shabbat are worse than none: anything but this week's readable

  if (!t || !bulletinCurrent(b)) {
    const h = holyState();
    const rows = h ? [h.lastMark && h.lastMark.category === "candles" ? ["Candle lighting", h.lastMark.d] : null, h.nextHav ? ["Havdalah", h.nextHav.d] : null].filter(Boolean) : [];
    const why = !b.file ? "The shul's bulletin hasn't been fetched." : !pd(b.shabbat) ? "The bulletin's date isn't known, so its times aren't shown."

    return `<div class="st-msg">${why} Shul times unavailable. See the bulletin.</div>
      <div class="st-wrap"><div class="st-cols"><div>${rows.map(([l, d]) => `<div class="st-row"><span class="l">${l}</span><span class="h"></span><span class="tm">${hmap(d)}</span></div>`).join("")}</div></div></div>`;
  }
  const items = [];
  t.rows.forEach((r, i) => {

    items.push(`<div class="st-row"><span class="l">${esc(r.label)}</span><span class="h">${esc(r.he)}</span><span class="tm">${esc(r.time)}</span></div>`);

// a long Yom Tov sheet shrinks to fit rather than losing its last rows (Shabbat ends)
function fitShabbat(layer) {

// rotation
let order = [], idx = 0, sceneStart = Date.now(), current = null, front = "layerA";
const HOLD = Q.get("hold") === "1";

// this screen's scenes and seconds, from the server (the Display Manager); today's order without one
function rotationList() {
  const r = CFG().rotation;
  if (Array.isArray(r) && r.length) return r;
  const secs = CFG().rotation_seconds || {};
  return ["agenda", "shul", "yankees", "mlb", "news", "israel"].map((scene) => ({scene, seconds: secs[scene] || 30}));
}
// live team scenes repeat every other turn: L1 s1 L2 s2 L1 s3 ...
function withLive(seq, live) {
  if (!live.length) return seq;
  const out = [], rest = seq.filter((s) => !live.includes(s));
  rest.forEach((s, i) => { out.push(live[i % live.length]); out.push(s); });
  return out;
}
function liveScenes() {
  const t = D("team");
  return [...(t && t.live ? ["yankees"] : []),
          ...sportKeys().filter((k) => ((D("sport_" + k) || {}).team || {}).live).map((k) => k + "_team")];
}
function buildOrder() {
  const has = (k) => { const f = D(k); return !!(f && f.items && f.items.length); };
  const shul = D("shul"), team = D("team") || {};
  const ok = {agenda: agendaOn(), yankees: !team.off, mlb: !team.off, news: has("nyt") || has("cnn"), israel: has("toi"),
              shul: !!(shul && (isHoly() ? shul.bulletin || D("calendar") : shul.chart || shulShabbatOn())),
              business: bizOn()};
  for (const k of sportKeys()) {
    const v = D("sport_" + k), on = !!(v && v.on && v.in_season);
    ok[k + "_team"] = on && !!v.team;
    ok[k] = on;
  }
  const want = Q.get("scene");
  const base = rotationList().map((r) => r.scene).filter((s) => SCENES[s]);
  if (want && SCENES[want] && !base.includes(want)) base.unshift(want);
  const live = liveScenes().filter((s) => base.includes(s) && ok[s]);
  const out = withLive(base, live).filter((s) => ok[s] || s === want);
  return out.length ? out : ["news"];
}
function duration(name) {
  const r = rotationList().find((x) => x.scene === name);
  return ((r && r.seconds) || (CFG().rotation_seconds || {})[name] || 30) * 1000;
}

// hide list items that would be cut off at the bottom of their column
function fitColumns(layer) {
  layer.querySelectorAll(".col").forEach((c) => {
    const limit = c.getBoundingClientRect().bottom + 1;
    const cut = new Set();
    c.querySelectorAll(".hl, .tx, .ev").forEach((el) => {
      const p = el.parentElement;
      if (cut.has(p) || el.getBoundingClientRect().bottom > limit) { el.style.display = "none"; cut.add(p); }
    });
  });
}
function paint(layerId, name) {
  $(layerId).innerHTML = SCENES[name].render();
  fitColumns($(layerId));
  fitShabbat($(layerId));
}
function showScene(name, fade = true) {
  if (!SCENES[name]) name = "news";
  current = name;
  const back = front === "layerA" ? "layerB" : "layerA";
  const target = fade ? back : front;
  paint(target, name);
  if (fade) { $(back).classList.add("show"); $(front).classList.remove("show"); front = back; }
  else $(front).classList.add("show");
  $("stitle").textContent = SCENES[name].title();
  const tabs = [...new Set(order)];
  $("scenes").innerHTML = tabs.map((s) => `<span class="${s === name ? "on" : ""}" data-scene="${s}">${esc(sceneTab(s))}<i id="${s === name ? "prog" : ""}"></i></span>`).join("");
  renderChip();
}
// a live score chip for each favorite team playing now, except on that team's own scene
function renderChip() {
  const out = [], t = D("team");
  const chip = (attrs, g, what) => `<div class="chip on"${attrs}><span class="dot"></span>${esc(g.away.abbr)} ${g.away.score ?? 0}&nbsp; ${esc(g.home.abbr)} ${g.home.score ?? 0}&nbsp; <span style="font-weight:450">${esc(what)}</span></div>`;
  if (t && t.live && current !== "yankees") out.push(chip(tapGame(t.live), t.live, inningText(t.live)));
  for (const k of sportKeys()) {
    const g = ((D("sport_" + k) || {}).team || {}).live;
    if (g && current !== k + "_team") out.push(chip(tapScore(k, g), g, g.detail));
  }
  $("chips").innerHTML = out.join("");
}
function tick() {
  if (!S) return;
  if (lastInput && (!interactive() || Date.now() - lastInput >= idleMs())) endInteraction();
  if (lastInput) { sceneStart = Date.now(); panelCountdown(); }  // rotation waits while someone is using it
  const el = Date.now() - sceneStart;
  const p = $("prog");
  if (p) p.style.width = Math.min(100, el / duration(current) * 100) + "%";
  if (!HOLD && el > duration(current)) advance();
}
function advance() {
  order = buildOrder(); idx = (idx + 1) % order.length; sceneStart = Date.now();
  showScene(order[idx], true);
}

// ------------------------------------------------------------------ interaction
// Tap or click a headline, the weather or a game to open a panel over the scene; swipe,
// drag or the arrow keys change scenes. Two minutes after the last input everything goes
// back to the normal rotation. Off on Shabbat and Yom Tov, and as a screen saver.
const IDLE_MS = 120000;
const idleMs = () => (Q.get("debug") === "1" && window.IDLE_MS_OVERRIDE) || IDLE_MS;
const interactive = () => !document.body.classList.contains("holy") && Q.get("saver") !== "1";
// kind -> {load(arg) -> Promise<data>, render(data, arg) -> html, refreshMs?, shouldRefresh?(data)}
const PANELS = {};
let panelOpen = null, panelTimer = null, panelSeq = 0, lastInput = 0, down = null, lastXY = null;
// a touch screen gets full-screen panels (?fullpanel=1 to preview that with a mouse)
if ((window.matchMedia && matchMedia("(pointer: coarse)").matches) || Q.get("fullpanel") === "1") document.body.classList.add("fullpanel");

function touched(mouse) {
  if (!interactive()) return false;
  lastInput = Date.now();
  document.body.classList.add("touchable");
  if (mouse) document.body.style.cursor = "default";
  return true;
}
function endInteraction() {
  closePanel();
  lastInput = 0; sceneStart = Date.now();
  document.body.classList.remove("touchable");
  document.body.style.cursor = "";
}
function panelCountdown() {
  if (!panelOpen) return;
  const s = Math.max(0, Math.ceil((idleMs() - (Date.now() - lastInput)) / 1000));
  $("pcount").textContent = `Back to the display in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
async function loadPanel(seq) {
  const P = PANELS[panelOpen.kind], body = $("pbody");
  try {
    const data = await P.load(panelOpen.arg);
    if (seq !== panelSeq) return;  // closed or replaced while loading
    const top = body.scrollTop;
    body.innerHTML = P.render(data, panelOpen.arg);
    body.scrollTop = top;
    panelOpen.data = data;
  } catch (e) {
    if (seq === panelSeq && !panelOpen.data) body.innerHTML = `<div class="panel-msg">This couldn't be loaded right now.</div>`;
  }
}
function openPanel(kind, arg) {
  const P = PANELS[kind]; if (!P) return;
  closePanel();
  panelOpen = {kind, arg};
  const seq = ++panelSeq;
  $("pbody").innerHTML = `<div class="panel-msg">Loading…</div>`;
  $("pbody").scrollTop = 0;
  $("panel").hidden = false;
  panelCountdown();
  loadPanel(seq);
  if (P.refreshMs) panelTimer = setInterval(() => {
    if (panelOpen && (!P.shouldRefresh || P.shouldRefresh(panelOpen.data))) loadPanel(seq);
  }, P.refreshMs);
}
function closePanel() {
  clearInterval(panelTimer); panelTimer = null;
  panelSeq++; panelOpen = null;
  $("panel").hidden = true; $("pbody").innerHTML = "";
}
function goScene(to) {
  closePanel();
  order = buildOrder();
  const tabs = [...new Set(order)];
  if (!tabs.length) return;
  const name = typeof to === "string" ? to : tabs[(tabs.indexOf(current) + to + tabs.length) % tabs.length];
  if (!SCENES[name] || !tabs.includes(name)) return;
  idx = order.indexOf(name); sceneStart = Date.now();
  if (name !== current) showScene(name, true);
}
function tap(el) {
  if (el.closest(".panel-x")) return closePanel();
  const sc = el.closest("[data-scene]"); if (sc) return goScene(sc.dataset.scene);
  const tg = el.closest("[data-toggle]"); if (tg) return tg.classList.toggle("open");
  const t = el.closest("[data-tap]"); if (t) openPanel(t.dataset.tap, Object.assign({}, t.dataset));
}
document.addEventListener("pointerdown", (e) => {
  down = null;
  if (!touched(e.pointerType === "mouse")) return;
  down = {x: e.clientX, y: e.clientY, t: Date.now(), target: e.target, mouse: e.pointerType === "mouse",
          stage: !!e.target.closest(".scene-wrap, .stage-head"), top: $("pbody").scrollTop};
});
document.addEventListener("pointermove", (e) => {
  if (!down) {
    // only a real move counts: a pointermove with the mouse sitting still must not pause the display
    if (e.pointerType !== "mouse") return;
    const moved = lastXY && Math.hypot(e.screenX - lastXY[0], e.screenY - lastXY[1]) >= 4;
    if (!lastXY || moved) lastXY = [e.screenX, e.screenY];
    if (moved) touched(true);
    return;
  }
  // a touch scrolls the panel natively; a mouse drag scrolls it here
  if (down.mouse && panelOpen && (e.buttons & 1) && down.target.closest("#panel")) {
    $("pbody").scrollTop = down.top - (e.clientY - down.y);
  }
});
document.addEventListener("pointerup", (e) => {
  const d = down; down = null;
  if (!d || !interactive()) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (Math.hypot(dx, dy) < 10 && Date.now() - d.t < 500) return tap(d.target);
  if (d.stage && Math.abs(dx) >= 80 && Math.abs(dx) > 1.5 * Math.abs(dy)) goScene(dx < 0 ? 1 : -1);
});
document.addEventListener("pointercancel", () => { down = null; });
document.addEventListener("wheel", () => touched(true), {passive: true});
document.addEventListener("keydown", (e) => {
  if (!touched(false)) return;
  if (e.key === "ArrowRight") goScene(1);
  else if (e.key === "ArrowLeft") goScene(-1);
  else if (e.key === "Escape") closePanel();
});

// panel data comes from the server, or from makeDemo() when previewing without one
async function panelData(url, demoKey) {
  if (DEMO) return (S.demo_panels || {})[demoKey];
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok && r.status !== 404) throw new Error(r.status);
  return r.json();
}

// ------------------------------------------------------------------ other sports
// Every league chosen in the Display Manager gets two scenes, like the Yankees and MLB:
// "<league>_team" (the favorite's games, standings and news) and "<league>" (scores, news).
const LEAGUE_TAB = {nba: "NBA", wnba: "WNBA", nfl: "NFL", nhl: "NHL", mls: "MLS", ncaam: "NCAAM", ncaaw: "NCAAW", ncaaf: "NCAAF"};
const LEAGUE_TITLE = {nba: "Around the NBA", wnba: "Around the WNBA", nfl: "Around the NFL", nhl: "Around the NHL",
                      mls: "Around MLS", ncaam: "Men's college basketball", ncaaw: "Women's college basketball", ncaaf: "College football"};
// regulation periods: men's college basketball plays halves, soccer halves, hockey periods
const PERIODS = {nba: 4, wnba: 4, nfl: 4, nhl: 3, mls: 2, ncaam: 2, ncaaw: 4, ncaaf: 4};
const sportKeys = () => Object.keys(CFG().sports || {}).filter((k) => k !== "mlb" && LEAGUE_TAB[k]);
function registerSports() {
  for (const k of Object.keys(LEAGUE_TAB)) { delete SCENES[k + "_team"]; delete SCENES[k]; }
  for (const k of sportKeys()) {
    const lg = () => (CFG().sports || {})[k] || {};
    SCENES[k + "_team"] = {title: () => lg().favorite_name || LEAGUE_TAB[k], tab: () => lg().favorite_abbr || LEAGUE_TAB[k],
                           render: () => sportTeamScene(k)};
    SCENES[k] = {title: () => LEAGUE_TITLE[k], tab: LEAGUE_TAB[k], render: () => sportLeagueScene(k)};
  }
}
const tapScore = (key, g) => g.id ? ` data-tap="score" data-key="${esc(key)}" data-id="${esc(g.id)}"` : "";
function periodLabels(key, n) {
  const reg = PERIODS[key] || 4;
  return Array.from({length: Math.max(reg, n)}, (_, i) => i < reg ? (reg === 2 ? ["1st", "2nd"][i] : String(i + 1))
                                                                  : (key === "mls" ? "ET" : "OT" + (i > reg ? i - reg + 1 : "")));
}
function sportStatus(g) {
  if (g.state === "Live") return `<span class="st"><span class="livedot"></span>${esc(g.detail)}</span>`;
  if (g.state === "Final" || g.state === "Off") return `<span class="st">${esc(g.detail || g.state)}</span>`;
  const d = pd(g.start);
  return `<span class="st">${d ? `${dayLabel(d)} ${hmap(d)}` : esc(g.detail)}</span>`;
}
function lineTable(key, g) {
  const n = Math.max(g.away.lines.length, g.home.lines.length);
  if (!n) return "";
  const cols = periodLabels(key, n);
  const row = (t) => `<tr><td>${esc(t.abbr)}</td>${cols.map((_, i) => `<td>${t.lines[i] ?? ""}</td>`).join("")}<td class="rhe">${t.score ?? ""}</td></tr>`;
  return `<table class="box-line sp-line"><tr><th></th>${cols.map((c) => `<th>${c}</th>`).join("")}<th>T</th></tr>${row(g.away)}${row(g.home)}</table>`;
}
function sportCard(key, g, opts = {}) {
  const fin = g.state === "Final", pre = g.state === "Preview";
  const row = (t, o) => {
    const lose = fin && t.score != null && o.score != null && t.score < o.score;
    const sub = pre || opts.showRecord ? t.record : "";
    return `<div class="gc-row${lose ? " lose" : ""}"><span class="ab">${esc(t.abbr)}</span>
      <span class="nm">${esc(t.name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>
      <span class="r">${pre ? "" : (t.score ?? "")}</span><span class="he"></span><span class="he"></span></div>`;
  };
  const head = fin ? short(pd(g.start)) : pre ? "Next game" : "";
  return `<div class="gc"${tapScore(key, g)}><div class="gc-head"><span>${esc(head)}</span>${sportStatus(g)}</div>
    ${row(g.away, g.home)}${row(g.home, g.away)}${pre ? "" : lineTable(key, g)}
    ${g.venue ? `<div class="gc-foot"><span>${esc(g.venue)}</span></div>` : ""}</div>`;
}
function sportMini(key, g) {
  const fin = g.state === "Final";
  const rw = (t, o) => `<div class="rw${fin && t.score < o.score ? " lose" : ""}"><span>${esc(t.abbr)}</span><span>${g.state === "Preview" ? "" : (t.score ?? "")}</span></div>`;
  const st = g.state === "Live" ? `<span class="livedot"></span>${esc(g.detail)}` : g.state === "Preview" ? esc(hmap(pd(g.start))) : esc(g.detail || "Final");
  return `<div class="mini${g.chosen ? " me" : ""}"${tapScore(key, g)}><div class="st">${st}</div>${rw(g.away, g.home)}${rw(g.home, g.away)}</div>`;
}
function standTable(st) {
  if (!st || !st.rows || !st.rows.length) return `<div class="empty">No standings yet.</div>`;
  let rows = st.rows.slice(0, 8);
  const me = st.rows.find((r) => r.is_team);
  if (me && !rows.includes(me)) rows = rows.slice(0, 7).concat([me]);
  return `<table class="stand"><tr><th>${esc(st.group || "")}</th>${st.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>
    ${rows.map((r) => `<tr class="${r.is_team ? "me" : ""}"><td>${esc(r.abbr)}</td>${r.vals.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table>`;
}
function sportTeamScene(key) {
  const v = D("sport_" + key) || {}, t = v.team || {}, lg = (CFG().sports || {})[key] || {}, src = "sport_" + key;
  let left = "";
  if (t.live) left = sportCard(key, t.live, {showRecord: true});
  else {
    if (t.last) left += sportCard(key, t.last);
    if (t.next) left += `<div style="height:1.1rem"></div>` + sportCard(key, t.next);
    if (!left) left = `<div class="empty">No games scheduled.</div>`;
  }
  return `<div class="grid2" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)"><div>${left}</div><div class="col"><div class="col-h"><h3>Standings</h3>${ageHTML(src)}</div>${standTable(v.standings)}</div></div>
    <div class="grid2" style="flex:1">${col(`${lg.favorite_name || LEAGUE_TAB[key]} news`, src, headlineList((v.team_news || {}).items || [], src, 5))}${col(`${LEAGUE_TAB[key]} news`, null, headlineList((v.news || {}).items || [], src, 5))}</div>`;
}
function sportLeagueScene(key) {
  const v = D("sport_" + key) || {}, sc = v.scores || {}, games = sc.games || [], src = "sport_" + key;
  const label = games.length && sc.label === "Yesterday" ? `<div class="col-h"><h3>Yesterday's scores</h3></div>` : "";
  let top = "";
  if (games.length && games.length <= 2) top = `<div class="grid2">${games.map((g) => sportCard(key, g)).join("")}</div>`;
  else if (games.length > 2) top = `<div class="mini-grid">${games.slice(0, 8).map((g) => sportMini(key, g)).join("")}</div>`;
  const news = (v.news || {}).items || [];

  return `${top ? `<div>${label}${top}</div>` : `<div class="empty">No games today.</div>`}

      ${news.length ? `<div class="grid2"><div class="col">${li(news.slice(0, half))}</div><div class="col">${li(news.slice(half, half * 2))}</div></div>` : emptyMsg(src)}</div>`;
}
function findGame(key, id) {
  const v = D("sport_" + key) || {}, t = v.team || {};
  return [t.live, t.next, t.last, ...(t.recent || []), ...((v.scores || {}).games || [])].find((g) => g && String(g.id) === String(id)) || null;

// the simple score panel: the game is already in the state, so nothing is fetched

const bizOn = () => { const m = D("markets"); return !!(m && !m.off && ((m.indices || []).length || (m.watch || []).length)); };

// Teaneck's spot on the NWS Upton, NY (KOKX) radar image, as a share of its width and height
const RADAR_X_PCT = 21.5, RADAR_Y_PCT = 51;
function forecastGraph(hours, marks) {
  const W = 480, top = 16, bot = 88, barTop = 96, barBot = 120;
  if (!hours.length) return "";
  const temps = hours.map((h) => h.temp);
  const lo = Math.min(...temps), hi = Math.max(...temps), span = Math.max(hi - lo, 1);
  const t0 = pd(hours[0].time).getTime(), step = W / hours.length;
  const X = (i) => step * (i + .5);
  const Y = (t) => bot - (t - lo) / span * (bot - top);
  // temperature: a curve through the midpoints between hours
  let path = `M${X(0).toFixed(1)},${Y(temps[0]).toFixed(1)}`;
  for (let i = 1; i < temps.length; i++) {
    const mx = (X(i - 1) + X(i)) / 2, my = (Y(temps[i - 1]) + Y(temps[i])) / 2;
    path += ` Q${X(i - 1).toFixed(1)},${Y(temps[i - 1]).toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  path += ` T${X(temps.length - 1).toFixed(1)},${Y(temps[temps.length - 1]).toFixed(1)}`;
  let svg = `<svg class="fc-graph" viewBox="0 0 ${W} 140">`;
  svg += `<line x1="0" y1="${barBot}" x2="${W}" y2="${barBot}" class="ax"/>`;
  hours.forEach((h, i) => {
    if (h.precip > 0) { const ht = h.precip / 100 * (barBot - barTop); svg += `<rect x="${(X(i) - step * .4).toFixed(1)}" y="${(barBot - ht).toFixed(1)}" width="${(step * .8).toFixed(1)}" height="${ht.toFixed(1)}" class="bar"/>`; }
    const d = pd(h.time);
    if (d.getHours() % 6 === 0) {
      const lab = d.getHours() === 0 ? d.toLocaleDateString("en-US", {weekday: "short"}) : (d.getHours() % 12 || 12) + (d.getHours() < 12 ? "a" : "p");
      svg += `<line x1="${X(i).toFixed(1)}" y1="${barBot}" x2="${X(i).toFixed(1)}" y2="${barBot + 3}" class="ax"/><text x="${X(i).toFixed(1)}" y="134" class="lab${d.getHours() === 0 ? " day" : ""}">${lab}</text>`;
    }
  });
  // rain amount over the wettest hour of each rainy stretch
  let run = null;
  const flush = () => { if (run && run.total >= .05) svg += `<text x="${X(run.peak).toFixed(1)}" y="${barTop - 3}" class="amt">${run.total.toFixed(2)}″</text>`; run = null; };
  hours.forEach((h, i) => {
    if (h.precip >= 30 || h.amount_in > 0) {
      run = run || {total: 0, peak: i};
      run.total += h.amount_in || 0;
      if (h.precip > hours[run.peak].precip) run.peak = i;
    } else flush();
  });
  flush();
  (marks || []).forEach((m) => {
    const x = (pd(m.time).getTime() - t0) / 3600000 * step + step / 2;
    if (x >= 0 && x <= W) svg += `<line x1="${x.toFixed(1)}" y1="6" x2="${x.toFixed(1)}" y2="${barBot}" class="mark"/><text x="${(x + 3).toFixed(1)}" y="12" class="mlab">${esc(m.label)} ${hm(pd(m.time))}</text>`;
  });
  svg += `<path d="${path}" class="temp"/>`;
  const iHi = temps.indexOf(hi), iLo = temps.indexOf(lo);
  svg += `<text x="${X(iHi).toFixed(1)}" y="${(Y(hi) - 5).toFixed(1)}" class="tl">${hi}°</text><text x="${X(iLo).toFixed(1)}" y="${(Y(lo) - 5).toFixed(1)}" class="tl">${lo}°</text>`;
  return svg + "</svg>";
}

         <i class="fc-here" style="left:${RADAR_X_PCT}%;top:${RADAR_Y_PCT}%"></i>`;
    return `${alerts}<div class="fc">
