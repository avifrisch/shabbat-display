name: ShabbatDisplay
options:
  bundleIdPrefix: com.avifrischlaw
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "668K42535W"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2"

targets:
  ShabbatDisplay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShabbatDisplay
    info:
      path: ShabbatDisplay/Info.plist
      properties:
        CFBundleDisplayName: Shabbat Display
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The display server is plain http on the home network (or a Tailscale address).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Shows the Shabbat Display running on your home computer."
        NSMicrophoneUsageDescription: "Hears requests after the wake phrase, such as a timer or a shopping-list item. Off on Shabbat and Yom Tov."
        NSSpeechRecognitionUsageDescription: "Turns what you say after the wake phrase into words."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avifrischlaw.shabbatdisplay
        PRODUCT_NAME: ShabbatDisplay

  ShabbatDisplayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShabbatDisplayTests
    dependencies:
      - target: ShabbatDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avifrischlaw.shabbatdisplay.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  ShabbatDisplay:
    build:
      targets:
        ShabbatDisplay: all
    test:
      targets:
        - ShabbatDisplayTests
