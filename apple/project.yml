name: ShabbatDisplay
options:
  bundleIdPrefix: com.avifrischlaw
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "668K42535W"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  ShabbatDisplay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShabbatDisplay
      - path: Shared
    dependencies:
      - target: AnnouncementSpeaker
    info:
      path: ShabbatDisplay/Info.plist
      properties:
        CFBundleDisplayName: Shabbat Display
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The display server is plain http on the home network (or a Tailscale address).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Many radio stations still stream over plain http.
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: "Shows the Shabbat Display running on your home computer."
        NSMicrophoneUsageDescription: "Hears requests after the wake phrase, such as a timer or a shopping-list item. Off on Shabbat and Yom Tov."
        NSHomeKitUsageDescription: "Switches lights and other devices in your Home when you ask."
        NSAppleMusicUsageDescription: "Plays the music you ask for from Apple Music."
        NSSpeechRecognitionUsageDescription: "Turns what you say after the wake phrase into words."
    entitlements:
      path: ShabbatDisplay/ShabbatDisplay.entitlements
      properties:
        com.apple.developer.homekit: true
        # Announcements as notifications; "time sensitive" lets them through a Focus.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.avifrischlaw.shabbatdisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avifrischlaw.shabbatdisplay
        PRODUCT_NAME: ShabbatDisplay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Speaks an announcement that arrives while the app is closed.
  AnnouncementSpeaker:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AnnouncementSpeaker
      - path: Shared
      - path: ShabbatDisplay/Core/HolySpans.swift
    info:
      path: AnnouncementSpeaker/Info.plist
      properties:
        CFBundleDisplayName: Shabbat Display
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: AnnouncementSpeaker/AnnouncementSpeaker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.avifrischlaw.shabbatdisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avifrischlaw.shabbatdisplay.speaker
        PRODUCT_NAME: AnnouncementSpeaker
        SKIP_INSTALL: true

  ShabbatDisplayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShabbatDisplayTests
    dependencies:
      - target: ShabbatDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avifrischlaw.shabbatdisplay.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  ShabbatDisplay:
    build:
      targets:
        ShabbatDisplay: all
    test:
      targets:
        - ShabbatDisplayTests
